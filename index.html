<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Accessories Store</title>
    <link rel="stylesheet" href="./Bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="./Bootstrap/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <!-- NAVBAR SECTION -->



    <!-- HERO SECTION -->

    <section class="hero-section position-relative d-flex align-items-center">
        <div class="container position-relative z-1 py-5">
            <div class="row">
                <div class="col-12 col-lg-7 col-xl-6">

                    <div class="d-flex align-items-center mb-3">
                        <span class="text-lime me-2 fs-6">&#9679;</span>
                        <span class="text-uppercase tracking-widest small fw-bold text-light opacity-75"
                            style="font-size: 0.75rem;">
                            Built for what's next
                        </span>
                    </div>

                    <h1 class="display-3 fw-bolder hero-title mb-4">
                        Power your<br>
                        <span class="text-lime">best build.</span>
                    </h1>

                    <p class="lead mb-5 text-light opacity-75 pe-md-5" style="font-size: 1.1rem;">
                        High-performance components, handpicked for builders who refuse to compromise.
                    </p>

                    <div class="d-flex flex-wrap align-items-center gap-4">
                        <a href="#products"
                            class="btn btn-lime rounded-0 px-4 py-3 fw-bold d-inline-flex align-items-center">
                            Explore components <i class="bi bi-arrow-up-right ms-2 fs-5"></i>
                        </a>
                        <a href="#"
                            class="text-white text-decoration-none fw-bold border-bottom pb-1 hover-lime-text transition-all">
                            Browse new arrivals
                        </a>
                    </div>

                </div>
            </div>
        </div>

        <div class="position-absolute bottom-0 end-0 p-4 pe-lg-5 z-1 d-none d-md-block">
            <div class="d-flex gap-4 gap-xl-5">

                <div class="stat-item ps-3 border-start border-secondary border-opacity-50">
                    <div class="fw-bold text-white fs-6">24H</div>
                    <div class="text-white opacity-50" style="font-size: 0.75rem;">Fast dispatch</div>
                </div>

                <div class="stat-item ps-3 border-start border-secondary border-opacity-50">
                    <div class="fw-bold text-white fs-6">3YR</div>
                    <div class="text-white opacity-50" style="font-size: 0.75rem;">Warranty</div>
                </div>

                <div class="stat-item ps-3 border-start border-secondary border-opacity-50">
                    <div class="fw-bold text-white fs-6">100%</div>
                    <div class="text-white opacity-50" style="font-size: 0.75rem;">Genuine parts</div>
                </div>

            </div>
        </div>
    </section>

    <!-- PRODUCTS SECTION -->

    
    <!-- FOOTER SECTION -->
     

    <script src="./Bootstrap/bootstrap.bundle.min.js"></script>
    <script src="./Bootstrap/all.min.js"></script>

</html>
